<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Jilin University Open-source Mirrors</title>
    <meta name="description" lang="zh" content="吉林大学开源镜像站，致力于提供高速稳定的 Linux 发行版软件源和自由软件镜像，促进自由和开源软件的使用。本站由吉林大学 Linux 用户协会负责运行维护。">
    <meta name="description" lang="en" content="Jilin University Open-source Mirrors aims to provide stable high-speed mirrors of Linux distros and free softwares, promoting the usage of free and open-source softwares. This service is maintained by Jilin University Linux User Group.">
    <link rel="shortcut icon" type="image/svg" href="/_static/logo.svg">
    <link rel="stylesheet" href="/_static/lib/normalize.min.css">
    <link rel="stylesheet" href="/_static/common.css">
    <!--# if expr="$page" -->
    <link rel="stylesheet" href="/_static/<!--# echo var="page" -->.css">
    <!--# endif -->
    <noscript>
        <!--# if expr="$noscript != true" -->
        <meta http-equiv="refresh" content="0;url=./?noscript=1">
        <!--# else -->
        <style>
            #app[v-cloak] {
                display: flex;
            }
            header nav {
                display: none;
            }
        </style>
        <!--# endif -->
    </noscript>
    <style>
        body {
            transform: scaleX(-1);
        }
        #app {
            transition: transform 1s cubic-bezier(0,1,1,1);
        }
        #app.fixmirror {
            transform: scaleX(-1);
        }
        #app.fixmirror #homepage-mirrored {
            transform: none;
        }
        #homepage-mirrored {
            transform: scaleX(-1);
            position: fixed;
            top: 0;
            height: 3em;
            width: 100%;
            z-index: 99;
            background: linear-gradient(hsl(0deg 80% 73% / 50%), hsl(0deg 80% 73% / 50%)), linear-gradient(var(--bg), var(--bg));
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: keep-all;
        }
        header {
            padding-top: 4em;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div id="homepage-mirrored"><p v-html="_.aprilMirror">Due to a maintenance mistake, the page is malfunctioning, please try <a href="javascript:tryFixMirror()">fix it with a mirror</a>.</p></div>
        <header>
            <nav>
                <a @click.prevent="switchLang" href="#">中文 / English</a>
                <a id="back" href="/" v-html="_.back">Back to Mirrors</a>
            </nav>
            <div>
                <a href="/">
                    <img src="/_static/logo.svg" alt="Logo of Jilin University" :alt="_.logoAlt">
                </a>
                <h1 v-html="_.titleH1">Jilin&nbsp;University Open&#8209;source&nbsp;Mirrors</h1>
            </div>
        </header>
        <div class="banner" v-html="_.bannerWarning"></div>
        <script>
            var i18n = {
                en: {},
                zh: {}
            }
            i18n.en.title = 'Jilin University Open-source Mirrors'
            i18n.zh.title = '吉林大学开源镜像站'
            i18n.en.titleH1 = 'Jilin&nbsp;University Open&#8209;source&nbsp;Mirrors'
            i18n.zh.titleH1 = '吉林大学开源镜像站'
            i18n.en.logoAlt = 'Logo of Jilin University'
            i18n.zh.logoAlt = '吉林大学校徽'
            i18n.en.back = 'Back to Mirrors'
            i18n.zh.back = '回到主站'
            i18n.en.aprilMirror = 'Due to a maintenance mistake, the page is malfunctioning, please try <a href="javascript:tryFixMirror()">fix mirror with a mirror</a>.'
            i18n.zh.aprilMirror = '由于维护失误，镜像站首页显示故障，<wbr>请<a href="javascript:tryFixMirror()">尝试使用镜子修复</a>。'
            i18n.en.aprilMirrorFix = 'YOU FIXED THE MIRROR!'
            i18n.zh.aprilMirrorFix = '你把镜像站修好了！'
            i18n.en.aprilMirrorNotFix = 'Uh oh... Not working...'
            i18n.zh.aprilMirrorNotFix = '不行...没修好...'
            i18n.en.aprilMirrorUnFix = 'OH NO, You turned it BACK!'
            i18n.zh.aprilMirrorUnFix = '啊啊啊又转回去了！！'
            i18n.en.bannerWarning = ''
            i18n.zh.bannerWarning = ''
        </script>
